<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <title>Memòria cartes</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/p100-memoria.js"></script>
</head>

<body>

<header>
    <h1>Memòria cartes</h1>

    <div id="controls">
        <label for="nivell">Tria la mida del tauler: </label>
        <select id="nivell">
            <option value="personalitzat">Personalitzat</option>
            <option value="2x2">Molt fàcil (2x2)</option>
            <option value="4x4" selected>Normal (4x4)</option>
            <option value="4x6">Difícil (4x6)</option>
        </select>
        <label for="cartes"> Escull el tipus de cartes: </label>
        <select id="cartes">
            <option value="deck" selected>Pòquer modern</option>
            <option value="poker1">Pòquer clàssic</option>
            <option value="pokemon">Pokemon</option>
        </select>
        <div id="personalitzat-size" style="display:none;">
            <label>Files:</label>
            <input type="number" id="files" min="2" max="10">
            <label>Columnes:</label>
            <input type="number" id="columnes" min="2" max="10">
        </div>
        <button id="btn-iniciar">Generar Joc</button>
    </div>

</header>

<div id="juego-contenedor">
    
    <div id="tauler">
        <p id="mensajeInicial">Escull un mode per començar a jugar</p>
    </div>

    <div id="marcador">
        <p>Parelles: <span id="parelles">0</span></p>
        <p>Clics: <span id="clics">0</span></p>
        <p>Clics restants: <span id="clics-restants">0</span></p>
        <p>Temps: <span id="tiempo">0</span>s</p>
    </div>

</div>

<footer>
    <p>Fes clic en una carta per donar-li la volta</p>
</footer>

</body>
</html>
